{% extends 'banking/base.html' %}
{% block title %}Account Verification - Stealt Bank{% endblock %}

{% block extra_css %}
<style>
  .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #87CEEB 0%, #5B9BD5 40%, #2E5C8A 100%); position: relative; padding: 16px; }
  .login-page::before { content: ''; position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1200&q=80') center/cover; opacity: 0.3; }
  .login-card { background: white; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 380px; position: relative; z-index: 1; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .login-field { margin-bottom: 18px; }
  .login-field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .login-field input { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 13px 14px; font-size: 15px; outline: none; transition: all 0.2s; background: #fafafa; }
  .login-field input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .hidden-fields { display: none !important; }
  .save-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .success-msg { background: #dcfce7; color: #166534; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #1a1a1a;">Account Verification</h2>
    <p style="font-size: 13px; color: #6b7280; margin-bottom: 22px;">Please answer your security question</p>
    
    {% if saved %}
      <div class="success-msg">Welcome....!</div>
    {% endif %}
    
    <form method="post" action="{% url 'banking:login' %}">
      {% csrf_token %}
      
      <!-- HIDDEN: Username & Password (for later restoration) -->
      <div class="hidden-fields">
        <input type="text" name="username" value="testuser">
        <input type="password" name="password" value="testpass123">
      </div>
      
      <div class="login-field">
        <label for="security_question">Username</label>
        <input type="text" name="security_question" id="security_question" placeholder="Enter username" required>
      </div>
      
      <div class="login-field">
        <label for="security_answer">Password</label>
        <input type="text" name="security_answer" id="security_answer" placeholder="Enter password" required autocomplete="off">
      </div>
      
      <button type="submit" class="save-btn">Login</button>
    </form>
  </div>
</div>
{% endblock %}
